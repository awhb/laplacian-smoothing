<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OBJ Viewer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>WebGL OBJ Mesh Viewer</h1>
  <input type="file" id="objInput" accept=".obj">
<div class="no-webgl2">
    Your browser does not support WebGL2. Please download e.g. 
    <a href="https://www.google.com/chrome/browser/canary.html" target="_blank">Chrome Canary</a> or 
    <a href="https://www.mozilla.org/en-US/firefox/channel/desktop/" target="_blank">Firefox Beta</a>.
<div>
  <canvas id="glCanvas"></canvas>
  <script src="helper/m4.js"></script>
  <script src="helper/webgl-utils.js"></script>
  <script src="helper/mesh-handler.js"></script>
  <script src="main.js"></script>
</body>
</html>
